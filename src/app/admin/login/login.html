<section class="admin-login-bg">
    <div class="bg-overlay"></div>

    <div class="login-container">
        <mat-card class="login-card glass">

            <h2 class="login-title">
                Admin <span class="text-gradient">Login</span>
            </h2>

            <p class="login-subtitle">
                Secure access to hospital administration
            </p>

            <form [formGroup]="loginForm" (ngSubmit)="login()">

                <!-- USERNAME -->
                <mat-form-field appearance="outline">
                    <mat-label>Username</mat-label>
                    <input matInput formControlName="username" />
                </mat-form-field>

                <!-- PASSWORD -->
                <mat-form-field appearance="outline">
                    <mat-label>Password</mat-label>
                    <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password" />
                    <button mat-icon-button matSuffix type="button" (click)="hidePassword = !hidePassword">
                        <mat-icon>
                            {{ hidePassword ? 'visibility_off' : 'visibility' }}
                        </mat-icon>
                    </button>
                </mat-form-field>

                <!-- REMEMBER ME -->
                <div class="remember-row">
                    <mat-checkbox formControlName="rememberMe">
                        Remember me
                    </mat-checkbox>
                </div>

                 <!-- Login-Error -->
                <p class="login-error" *ngIf="loginError">
                    {{ loginError }}
                </p>


                <!-- LOGIN BUTTON -->
                <button mat-raised-button color="primary" class="login-btn">
                    Login
                </button>

            </form>

        </mat-card>
    </div>
</section>
